name: vonkprogramming-pipeline
on:
  push:
    branches:
      - master

jobs:
  pipeline:
    name: Pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 💻 Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: 💻 Install npm dependencies
        run: npm ci

      - name: 🔍 Lint
        run: npm run lint

      - name: 🗒️ Vulnerability scan
        run: npm audit

      - name: 🔨 Build
        run: npm run build --production

      - name: 📝 Create config.php file
        run: |
          echo "<?php" > ./dist/scripts/config.php
          echo "\$DB_SERVER='${{ secrets.DB_SERVER }}';" >> ./dist/scripts/config.php
          echo "\$DB_NAME='${{ secrets.DB_NAME }}';" >> ./dist/scripts/config.php
          echo "\$DB_USERNAME='${{ secrets.DB_USERNAME }}';" >> ./dist/scripts/config.php
          echo "\$DB_PASSWORD='${{ secrets.DB_PASSWORD }}';" >> ./dist/scripts/config.php
          echo "\$ACCESS_TOKEN='${{ secrets.ACCESS_TOKEN }}';" >> ./dist/scripts/config.php

      - name: 📁 Publish
        uses: Creepios/sftp-action@v1.0.5
        with:
          host: "ssh.strato.com"
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          localPath: "./dist"
          remotePath: "./vonk-os"
